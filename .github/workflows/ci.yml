name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Subversion
        run: brew install subversion

      - name: Run tests
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: swift test
