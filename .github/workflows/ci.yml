name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE_APP" ]]; then
            echo "Xcode 16 not found on runner:"
            ls /Applications
            exit 1
          fi
          sudo xcode-select -switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install Subversion
        run: brew install subversion

      - name: Run tests
        run: swift test
